#!/usr/sbin/nft -f
# 30-security: SER8 firewall — LAN-only inbound, drop-by-default WAN.
# Templated from templates/etc/nftables.conf — edit there, not here.
# The ${LAN_SUBNET} placeholder is expanded by envsubst at deploy time
# (default 192.168.1.0/24; override via secrets.env or env LAN_SUBNET).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        # Loopback always allowed
        iif lo accept

        # Outbound-initiated conversations come back in here
        ct state established,related accept
        ct state invalid drop

        # ICMPv4 + ICMPv6 (ping, path-MTU discovery, neighbor discovery)
        meta l4proto { icmp, icmpv6 } accept

        # mDNS — anyone on LAN can discover this host as <hostname>.local
        udp dport 5353 ip saddr ${LAN_SUBNET} accept

        # SSH + HTTP + HTTPS — LAN clients only
        tcp dport { 22, 80, 443 } ip saddr ${LAN_SUBNET} accept

        # Anything else: count (for visibility via `nft list ruleset`) and drop
        counter drop
    }

    chain forward {
        # Not a router — no packet forwarding
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        # Trust outbound; nftables on a workstation is for inbound hardening
        type filter hook output priority filter; policy accept;
    }
}

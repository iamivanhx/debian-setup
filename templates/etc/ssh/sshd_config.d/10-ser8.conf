# 30-security: SSH hardening drop-in. Debian's sshd reads /etc/ssh/sshd_config.d/*.conf
# after the main /etc/ssh/sshd_config, so this file's directives win.
# PRD §5.10: key-only, no root, no password. nftables enforces LAN-only at the
# packet layer; sshd itself binds 0.0.0.0 so the policy is one knob to turn.

PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
UsePAM yes
X11Forwarding no
ListenAddress 0.0.0.0
ClientAliveInterval 300
ClientAliveCountMax 2
MaxAuthTries 3
LoginGraceTime 30
PrintMotd no
